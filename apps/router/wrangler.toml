name = "router"
main = "src/index.ts"
compatibility_date = "2025-01-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 0.1 # 10% sampling for logs

# Development environment
[env.dev]

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "97f198cbb9d24db39a1118068eedef6d"

[[env.dev.hyperdrive]]
binding = "DATABASE"
id = "55e116da66144f73979bf2ae10a14ac5"

[[env.dev.queues.producers]]
binding = "QUEUE"
queue = "router-dev"

[[env.dev.queues.consumers]]
queue = "router-dev"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "router-dev-dlq"

[[env.dev.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "router-dev"

[[env.dev.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Production environment
[env.production]

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "e7604dc03c8041939a7d948f9e982098"

[[env.production.hyperdrive]]
binding = "DATABASE"
id = "0d28d47db3904d39ad5ac92f891b8981"

[[env.production.queues.producers]]
binding = "QUEUE"
queue = "router"

[[env.production.queues.consumers]]
queue = "router"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "router-dlq"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "router"

[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 1000, period = 60 }